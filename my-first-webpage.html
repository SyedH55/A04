<!-- 
 File: my-first-web-page.html
 Description: A simple webpage that shows course details, username, name, 
              and a footer with copyright, name, and the due date.
-->
            
<!DOCTYPE html> <!-- Declare the document type as using HTML 5-->
<html> <!--Begins the html section -->
    <head> <!--Begins the header section which includes metadata and favicon info-->
        <title>Casa de Webpage</title> <!--Sets the title of the webpage that appears in the browser tab-->
        <link rel="icon" type="images/x-icon" href="/house.ico"> <!--Turns the favicon into a house logo that is locally stored-->
    </head> <!--Ends the header section-->
    <body> <!--Begins the body section which contains all the visible elements of the page-->
        <h1 style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">This is my first webpage! :D</h1> <!--Top/main header to introduce the webpage with the Segoe UI font-->
        <h3 style="font-weight: normal;font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif">This class is called <b style="text-decoration-line: underline; text-decoration-color: aqua; text-decoration-style: double;">Intro to Website Development</b>, Course Number: 117, Section Number: 003</h3> <!--Smaller header which contains the information of the course name, number, and section along with various styling elements such as bolding, double blue underlines, and a different font-->
        <p style="font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">Did you know that <q>casa</q> means <em>house</em> in Spanish?</p> <!--Paragraph text with a fun fact inside and a changed font-->
        <span>If you're</span> <!--Spans used to more easily style one line with different stylations, this is the first few words-->
        <span style="text-shadow: 2px 2px 4px gray;">curious</span> <!--Gives the word curious a gray shadow-->
        <span>, my </span> <!--continues the sentence with default formatting-->
        <span style="background-color: rgb(2, 2, 68);color: #FFF;">GitHub</span> <!--Makes the word GitHub have a black background and white text to match GitHub's styles--> 
        <span>username is</span> <!--Continues the sentence before saying the username-->
        <span style="text-decoration: overline underline; text-decoration-color: aquamarine;"><a href="https://github.com/SyedH55">SyedH55</a></span> <!--Gives the username an overline and underline and links it to my GitHub account-->
    </body> <!--Ends the body section-->
    <footer> <!--Begins the footer section which contains copyright info as well as the due date-->
        <span style="float: left; position:fixed; bottom: 5px; left: 5px">&copy Syed Haider</span> <!--Uses &copy to insert the copyright logo and uses a span to put the following line in the same line. Fixes the copyright and name to the bottom left corner-->
        <span style="float: right; position:fixed; bottom: 5px; right: 5px"><b>Made</b>: 10/1/2026, <b>Due Date</b>: 10/6/2026</span> <!--Shows the made date and due date with Made and Due Date in bold. Fixes this portion to the bottom right of the screen-->
    </footer> <!--Ends the footer section-->
</html> <!--Ends the html section, indicating there is no more html code-->
